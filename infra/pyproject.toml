[project]
name = "armoi-infra"
version = "0.1.0"
description = "Armoi — personal wardrobe & jewellery library API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "PyJWT[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "boto3>=1.35.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's `File(...)`/`Depends(...)` defaults are the documented idiom.
ignore = ["B008"]
